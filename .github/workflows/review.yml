# Example: run the reviewer on every PR of this repo (copy into your own repo's workflows).
# Uses the LLM agents when the ANTHROPIC_API_KEY secret exists, otherwise static analysis only.
# Note: secrets are not exposed to PRs from forks, so those get the static-only path.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAG=""
          if [ -z "$ANTHROPIC_API_KEY" ]; then FLAG="--static-only"; fi
          python -m reviewer review-pr --repo-name "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" --repo-dir . --post $FLAG
