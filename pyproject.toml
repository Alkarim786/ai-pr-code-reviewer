[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-code-reviewer"
version = "0.1.0"
description = "Multi-agent AI code reviewer for GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "ruff>=0.6",
  "bandit>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"eval/*" = ["E501"]

[tool.setuptools]
packages = ["reviewer"]
